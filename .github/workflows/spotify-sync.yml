name: METER Spotify sync

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

concurrency:
  group: meter-spotify-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake METER and collect recent Spotify listens
        env:
          METER_SYNC_URL: ${{ secrets.METER_SYNC_URL }}
          METER_CRON_SECRET: ${{ secrets.METER_CRON_SECRET }}
        run: |
          test -n "$METER_SYNC_URL" || { echo "Missing METER_SYNC_URL repository secret"; exit 1; }
          test -n "$METER_CRON_SECRET" || { echo "Missing METER_CRON_SECRET repository secret"; exit 1; }
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $METER_CRON_SECRET" \
            "$METER_SYNC_URL/api/cron/spotify-sync"
